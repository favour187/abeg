<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dayline voice recorder (temporary)</title>
<style>
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#101b2d;color:#f4f6f8}
main{max-width:900px;margin:0 auto;padding:22px}
h1{font-size:22px;margin:0 0 4px}.muted{color:#9fb0c7;font-size:14px}
.card{background:#16243b;border:1px solid #243856;border-radius:16px;padding:16px;margin-top:16px}
#script{font-size:20px;line-height:1.6;max-height:48vh;overflow:auto;white-space:pre-wrap;background:#0c1626;border-radius:12px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
button{font:inherit;padding:11px 18px;border-radius:12px;border:0;cursor:pointer;background:#2c3f63;color:#fff}
button.rec{background:#d64545}button.go{background:#1f9d74}button:disabled{opacity:.45;cursor:default}
input[type=password]{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #334a73;background:#0c1626;color:#fff;min-width:260px}
#timer{font-variant-numeric:tabular-nums;font-size:20px;min-width:90px}
#status{margin-top:12px;min-height:24px}a{color:#8fd3ff}
</style></head><body><main>
<h1>Voice recorder — temporary</h1>
<div class="muted">Read the script while you record. When you press Send, the recording is uploaded to the GitHub repo <b>favour187/dayline</b> under <code>recordings/</code>.</div>
<div class="card"><div class="muted">Script (read this while recording)</div><div id="script">Loading…</div></div>
<div class="card">
 <div class="row"><input id="pw" type="password" placeholder="Recorder password" autocomplete="off"></div>
 <div class="row">
  <button id="recBtn" class="rec">● Start recording</button>
  <span id="timer">0:00</span>
 </div>
 <div class="row"><audio id="player" controls hidden></audio></div>
 <div class="row"><button id="sendBtn" class="go" disabled>Send to GitHub</button><button id="againBtn" disabled>Record again</button></div>
 <div id="status" class="muted"></div>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
let rec=null,chunks=[],stream=null,blob=null,t0=0,tick=null;
fetch("script.txt").then(r=>r.text()).then(t=>$("#script").textContent=t).catch(()=>$("#script").textContent="Script could not load.");
function setStatus(m){$("#status").textContent=m;}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
$("#recBtn").onclick=async()=>{
 if(rec&&rec.state==="recording"){rec.stop();return;}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch{setStatus("Microphone permission was denied.");return;}
 const type=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(t=>MediaRecorder.isTypeSupported(t))||"";
 rec=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream);
 chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 rec.onstop=()=>{
  stream.getTracks().forEach(t=>t.stop());clearInterval(tick);
  blob=new Blob(chunks,{type:rec.mimeType||type||"audio/webm"});
  const url=URL.createObjectURL(blob);const p=$("#player");p.src=url;p.hidden=false;
  $("#recBtn").textContent="● Start recording";$("#sendBtn").disabled=false;$("#againBtn").disabled=false;
  setStatus("Recorded "+fmt(Math.round((Date.now()-t0)/1000))+". Listen, then Send or Record again.");
 };
 rec.start();t0=Date.now();
 tick=setInterval(()=>$("#timer").textContent=fmt(Math.round((Date.now()-t0)/1000)),500);
 $("#recBtn").textContent="■ Stop";$("#sendBtn").disabled=true;$("#againBtn").disabled=true;$("#player").hidden=true;
 setStatus("Recording…");
};
$("#againBtn").onclick=()=>{blob=null;$("#sendBtn").disabled=true;$("#againBtn").disabled=true;$("#player").hidden=true;$("#timer").textContent="0:00";setStatus("");};
function toBase64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(b);});}
$("#sendBtn").onclick=async()=>{
 if(!blob)return;
 const password=$("#pw").value;if(!password){setStatus("Enter the recorder password first.");return;}
 $("#sendBtn").disabled=true;setStatus("Uploading to GitHub…");
 try{
  const data=await toBase64(blob);
  const res=await fetch("/api/recording",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password,mimeType:blob.type,data})});
  const out=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(out.error||"Upload failed.");
  setStatus("Uploaded: ");const a=document.createElement("a");a.href=out.url;a.target="_blank";a.rel="noopener";a.textContent=out.path;$("#status").appendChild(a);
  $("#sendBtn").disabled=true;
 }catch(e){setStatus(e.message||"Upload failed.");$("#sendBtn").disabled=false;}
};
</script></body></html>
